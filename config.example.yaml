# PTC-MCP Configuration
# See SPEC.md for full configuration reference.

# MCP servers to connect to as a client.
# Each server's tools become available as async functions in execute_program.
servers: []
  # Example stdio server (secrets via ${VAR} from ptc-mcp's environment):
  # - name: financial-data
  #   transport: stdio
  #   command: node
  #   args: ["./financial-data-mcp/dist/index.js"]
  #   env:
  #     API_KEY: ${FINANCIAL_DATA_API_KEY}
  #
  # Example streamable HTTP server:
  # - name: remote
  #   transport: http
  #   url: "https://example.com/mcp"
  #   headers: {Authorization: "Bearer ${REMOTE_TOKEN}"}
  #
  # Example SSE server:
  # - name: internal-apis
  #   transport: sse
  #   url: "http://localhost:8080/mcp"

# Tool-level access control (uses namespaced names).
# 'allow' and 'block' are mutually exclusive.
tools: {}
  # block:
  #   - "mcp__internal_apis__delete_resource"
  # allow:                       # glob patterns work, e.g. "mcp__financial_data__*"
  #   - "mcp__financial_data__query_financials"

# Execution constraints for execute_program.
execution:
  timeout_seconds: 120
  max_output_bytes: 65536
  # "seatbelt" (macOS sandbox-exec, default) or "none" (no OS sandbox; opt-in).
  # See README "Sandbox".
  sandbox: seatbelt
  # Per-program tool-call budget (see README "Results, errors, and budgets").
  max_tool_calls: 100
  max_concurrent_calls: 8
  tool_call_timeout_seconds: 60
  trace: summary
